name: NetWizard CI

on:
  push:
    branches:
      - main
      - chore/stabilize-3.48.0
      - feat/**
      - fix/**
  pull_request:
  workflow_dispatch:

concurrency:
  group: netwizard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release checks
        run: npm run release:check

  backend:
    name: Go backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netwizard
          POSTGRES_PASSWORD: netwizard
          POSTGRES_DB: netwizard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netwizard -d netwizard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NETWIZARD_TEST_DATABASE_URL: postgres://netwizard:netwizard@localhost:5432/netwizard_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run backend tests
        run: go test ./...

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - quality
      - backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build --pull --tag netwizard-ci:${{ github.sha }} .

  pages-artifact:
    name: Package tested Pages artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - quality
      - backend
      - e2e
      - container
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static Pages artifact
        run: node scripts/build-pages.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy-pages:
    name: Deploy tested commit to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pages-artifact
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
