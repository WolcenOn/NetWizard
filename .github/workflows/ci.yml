name: NetWizard CI

on:
  push:
    branches:
      - main
      - chore/stabilize-3.48.0
      - feat/**
      - fix/**
  pull_request:
  workflow_dispatch:

concurrency:
  group: netwizard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release checks
        run: npm run release:check

      - name: Build Pages artifact
        run: npm run build:pages

  backend:
    name: Go backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netwizard
          POSTGRES_PASSWORD: netwizard
          POSTGRES_DB: netwizard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netwizard -d netwizard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NETWIZARD_TEST_DATABASE_URL: postgres://netwizard:netwizard@localhost:5432/netwizard_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify backend modules
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum || [ -n "$(git status --porcelain -- go.sum)" ]; then
            echo "::group::go.mod after tidy"
            cat go.mod
            echo "::endgroup::"
            echo "::group::go.sum after tidy"
            cat go.sum
            echo "::endgroup::"
            exit 1
          fi

      - name: Run backend tests
        run: go test ./...

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - quality
      - backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build production image
        run: docker build --pull --tag netwizard-ci:${{ github.sha }} .

      - name: Start production container
        run: |
          docker run --detach --rm --name netwizard-ci-runtime -p 8080:8080 netwizard-ci:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs netwizard-ci-runtime
          exit 1

      - name: Playwright production smoke
        env:
          NETWIZARD_PRODUCTION_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test --config=playwright.production.config.js

      - name: Upload production Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-production-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload production test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-production-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Production container logs
        if: failure()
        run: docker logs netwizard-ci-runtime || true

      - name: Stop production container
        if: always()
        run: docker stop netwizard-ci-runtime || true
